services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rcc}
      MYSQL_USER: ${MYSQL_USER:-rcc_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  schema-migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
      target: migration
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rcc}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_TLS_MODE: "false"
    command: ["up", "--timeout=5m", "--lock-timeout=10s"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  mysql-local-fixture:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rcc}
      MYSQL_USER: ${MYSQL_USER:-rcc_admin}
      MYSQL_PWD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql/local-fixture:/local-fixture:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec mysql --default-character-set=utf8mb4 --protocol=tcp --host=mysql --user="$${MYSQL_USER}"
        "$${MYSQL_DATABASE}" < /local-fixture/002-notification-templates.sql
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    restart: "no"

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    environment:
      ADMIN_HTTP_ADDR: 0.0.0.0:8080
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN}
      ADMIN_ALLOW_LOCAL_HTTP: ${ADMIN_ALLOW_LOCAL_HTTP:-false}
      ADMIN_TRUSTED_PROXIES: ${ADMIN_TRUSTED_PROXIES:-}
      ADMIN_REGISTER_LIMIT: ${ADMIN_REGISTER_LIMIT:-10}
      ADMIN_LOGIN_IP_LIMIT: ${ADMIN_LOGIN_IP_LIMIT:-60}
      ADMIN_LOGIN_FAILURE_LIMIT: ${ADMIN_LOGIN_FAILURE_LIMIT:-10}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rcc}
      MYSQL_USER: ${MYSQL_USER:-rcc_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_TLS_MODE: "false"
    ports:
      - "127.0.0.1:${ADMIN_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-local-fixture:
        condition: service_completed_successfully

volumes:
  mysql-data:
