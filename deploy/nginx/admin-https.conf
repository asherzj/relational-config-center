# Install in nginx's http context; replace hostname, certificate and Web root.
# Keep Admin bound to 127.0.0.1:8080 and reachable only by this trusted proxy.
server {
    listen 443 ssl;
    server_name config.example.internal;
    ssl_certificate /etc/nginx/tls/config.crt;
    ssl_certificate_key /etc/nginx/tls/config.key;
    root /srv/rcc/web;
    index index.html;
    # Do not log request URLs/query strings, headers, bodies or configuration values.
    access_log off;
    error_log /var/log/nginx/rcc-error.log crit;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
    location /health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
