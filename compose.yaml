services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rcc
      MYSQL_USER: rcc_admin
      MYSQL_PASSWORD: rcc_admin
      MYSQL_ROOT_PASSWORD: rcc_root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - rcc-mysql-data:/var/lib/mysql
      - ./deploy/mysql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urcc_admin", "-prcc_admin"]
      interval: 2s
      timeout: 3s
      retries: 30

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    environment:
      RCC_ADMIN_ADDR: 0.0.0.0:8080
      RCC_MYSQL_DSN: rcc_admin:rcc_admin@tcp(mysql:3306)/rcc?charset=utf8mb4
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  rcc-mysql-data:
